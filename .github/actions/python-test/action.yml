name: "Python Test Action"
description: "Set up Python, run tests"
inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.13"
  height:
    description: "Height"
    required: true
  weight:
    description: "Weight"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Run BMI Calculator
      env:
        HEIGHT: ${{ inputs.height }}
        WEIGHT: ${{ inputs.weight }}
        PYTHONPASS: ${{ github.workspace }}/scripts
      run: python scripts/bmi.py
      shell: bash
